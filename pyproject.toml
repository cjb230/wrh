[project]
name = "wrh"
version = "0.1.0"
description = "A personal data warehouse: an encrypted SQLite timeline of your digital history, browsable with Datasette."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "click>=8.1",
    "cryptography>=42",
    "datasette>=0.65,<0.66",
    "keyring>=25",
    "sqlcipher3>=0.6.5",
    "icalendar>=6.1",
    "recurring-ical-events>=3.3",
    # Photos metadata. macOS only: it reads the Photos library on the server.
    "osxphotos>=0.70; sys_platform == 'darwin'",
]

[project.scripts]
wrh = "wrh.cli:cli"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wrh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
