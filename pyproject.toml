[project]
name = "wrh"
version = "0.1.0"
description = "A personal data warehouse: an encrypted SQLite timeline of your digital history, browsable with Datasette."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "cryptography>=42",
    "datasette>=0.65,<0.66",
    "keyring>=25",
    "sqlcipher3-wheels>=0.5.4",
]

[project.scripts]
wrh = "wrh.cli:cli"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wrh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
